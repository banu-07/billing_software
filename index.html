<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Free Basic Billing Software</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md" id="invoice">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">INVOICE</h1>
        <input type="text" id="invoiceNum" value="INV-001" class="border p-1 rounded mt-1 font-mono text-sm">
      </div>
      <div class="text-right">
        <input type="text" id="companyName" placeholder="Your Business Name" class="font-bold text-lg text-right block border-b mb-1">
        <input type="date" id="invoiceDate" class="border p-1 rounded text-sm">
      </div>
    </div>

    <!-- Customer Details -->
    <div class="mb-6">
      <label class="block font-medium text-gray-700 text-sm mb-1">Bill To:</label>
      <input type="text" id="clientName" placeholder="Customer Name" class="w-full border p-2 rounded mb-2">
      <textarea id="clientAddr" placeholder="Customer Address / Tax ID" class="w-full border p-2 rounded text-sm" rows="2"></textarea>
    </div>

    <!-- Items Table -->
    <table class="w-full mb-4 border-collapse" id="itemsTable">
      <thead>
        <tr class="bg-gray-100 text-left text-sm font-semibold">
          <th class="p-2">Item / Description</th>
          <th class="p-2 w-20">Qty</th>
          <th class="p-2 w-28">Price ($)</th>
          <th class="p-2 w-28">Total ($)</th>
          <th class="p-2 w-12 no-print"></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="p-1"><input type="text" class="item-desc w-full border p-1 rounded" placeholder="Item description"></td>
          <td class="p-1"><input type="number" class="item-qty w-full border p-1 rounded" value="1" min="1" oninput="calculate()"></td>
          <td class="p-1"><input type="number" class="item-price w-full border p-1 rounded" value="0.00" step="0.01" oninput="calculate()"></td>
          <td class="p-1 item-total font-mono font-semibold p-2">0.00</td>
          <td class="p-1 text-center no-print"><button onclick="removeItem(this)" class="text-red-500 font-bold">×</button></td>
        </tr>
      </tbody>
    </table>

    <button onclick="addItem()" class="no-print bg-gray-200 text-gray-700 px-3 py-1 rounded text-sm font-medium hover:bg-gray-300 mb-6">+ Add Item</button>

    <!-- Summary -->
    <div class="flex justify-end">
      <div class="w-64 space-y-2">
        <div class="flex justify-between text-sm">
          <span>Subtotal:</span>
          <span id="subtotal" class="font-mono">$0.00</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span>Tax (%):</span>
          <input type="number" id="taxRate" value="10" class="w-16 border p-1 rounded text-right" oninput="calculate()">
        </div>
        <div class="flex justify-between font-bold text-lg border-t pt-2">
          <span>Grand Total:</span>
          <span id="grandTotal" class="font-mono">$0.00</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="max-w-3xl mx-auto mt-4 flex justify-end space-x-3">
    <button onclick="window.print()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">Print / Save PDF</button>
  </div>

  <script>
    // Set default date
    document.getElementById('invoiceDate').valueAsDate = new Date();

    function addItem() {
      const tbody = document.querySelector('#itemsTable tbody');
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="p-1"><input type="text" class="item-desc w-full border p-1 rounded" placeholder="Item description"></td>
        <td class="p-1"><input type="number" class="item-qty w-full border p-1 rounded" value="1" min="1" oninput="calculate()"></td>
        <td class="p-1"><input type="number" class="item-price w-full border p-1 rounded" value="0.00" step="0.01" oninput="calculate()"></td>
        <td class="p-1 item-total font-mono font-semibold p-2">0.00</td>
        <td class="p-1 text-center no-print"><button onclick="removeItem(this)" class="text-red-500 font-bold">×</button></td>
      `;
      tbody.appendChild(row);
    }

    function removeItem(btn) {
      const row = btn.closest('tr');
      if (document.querySelectorAll('#itemsTable tbody tr').length > 1) {
        row.remove();
        calculate();
      }
    }

    function calculate() {
      let subtotal = 0;
      const rows = document.querySelectorAll('#itemsTable tbody tr');
      rows.forEach(row => {
        const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        const price = parseFloat(row.querySelector('.item-price').value) || 0;
        const total = qty * price;
        row.querySelector('.item-total').innerText = total.toFixed(2);
        subtotal += total;
      });

      const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
      const taxAmount = subtotal * (taxRate / 100);
      const grandTotal = subtotal + taxAmount;

      document.getElementById('subtotal').innerText = '$' + subtotal.toFixed(2);
      document.getElementById('grandTotal').innerText = '$' + grandTotal.toFixed(2);
    }
  </script>
</body>
</html>
